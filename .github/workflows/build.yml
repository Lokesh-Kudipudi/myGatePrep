name: build

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: build-${{ matrix.platform.name }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - { os: macos-latest,   name: macos-aarch64, rust_target: aarch64-apple-darwin }
          - { os: macos-13,       name: macos-x86_64,  rust_target: x86_64-apple-darwin  }
          - { os: windows-latest, name: windows-x86_64, rust_target: x86_64-pc-windows-msvc }

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform.rust_target }}

      - name: Cache cargo registry & build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: backend -> target

      - name: Install frontend deps
        working-directory: frontend
        run: npm ci

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: backend
          args: --target ${{ matrix.platform.rust_target }}
          # Only publish a GitHub Release on v* tags. On other runs the
          # bundles are still uploaded as workflow artifacts below.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('GATE Focus Tracker {0}', github.ref_name) || '' }}
          releaseBody: 'See the changelog for details.'
          releaseDraft: true
          prerelease: false

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: gate-tracker-${{ matrix.platform.name }}
          path: |
            backend/target/${{ matrix.platform.rust_target }}/release/bundle/dmg/*.dmg
            backend/target/${{ matrix.platform.rust_target }}/release/bundle/macos/*.app
            backend/target/${{ matrix.platform.rust_target }}/release/bundle/msi/*.msi
            backend/target/${{ matrix.platform.rust_target }}/release/bundle/nsis/*.exe
          if-no-files-found: ignore
