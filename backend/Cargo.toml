[package]
name = "gate-tracker"
version = "0.1.0"
description = "GATE Focus Tracker — offline-first study tracker for GATE prep"
authors = ["Lokesh"]
edition = "2021"

[lib]
name = "gate_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-sql = { version = "2", features = ["sqlite"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
